<div class="flex justify-around items-center font-sans m-10 p-5">
  
  <div class="border border-black p-5 w-[380px] bg-white">
    <h3 class="text-center mb-4 text-lg font-medium text-gray-900">Datos Personales</h3>
    
    <div class="flex justify-between items-center mb-3">
      <label class="text-sm font-medium text-gray-900">Nombre</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Ingresar Nombre" 
             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-[220px] p-2">
    </div>
    
    <div class="flex justify-between items-center mb-3">
      <label class="text-sm font-medium text-gray-900">Apellido Paterno</label>
      <input type="text" [(ngModel)]="paterno" placeholder="Ingresar Apellido" 
             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-[220px] p-2">
    </div>
    
    <div class="flex justify-between items-center mb-3">
      <label class="text-sm font-medium text-gray-900">Apellido Materno</label>
      <input type="text" [(ngModel)]="materno" placeholder="Ingresar Apellido" 
             class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-[220px] p-2">
    </div>

    <h4 class="text-center mb-4 mt-6 text-sm font-medium text-gray-900">Fecha de nacimiento</h4>
    <div class="flex justify-between mb-6 text-center px-4">
      <div>
        <label class="text-xs text-gray-700 font-bold">Día</label>
        <input type="number" [(ngModel)]="dia" placeholder="Día" 
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-16 p-2 text-center">
      </div>
      <div>
        <label class="text-xs text-gray-700 font-bold">Mes</label>
        <input type="number" [(ngModel)]="mes" placeholder="Mes" 
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-16 p-2 text-center">
      </div>
      <div>
        <label class="text-xs text-gray-700 font-bold">Año</label>
        <input type="number" [(ngModel)]="anio" placeholder="Año" 
               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-20 p-2 text-center">
      </div>
    </div>

    <h4 class="text-center mb-2 text-sm font-medium text-gray-900">Seleccionar Sexo</h4>
    <div class="mb-6 px-4">
      <div class="flex items-center mb-2">
        <input type="radio" name="sexo" value="Masculino" [(ngModel)]="sexo" 
               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500">
        <label class="ml-2 text-sm font-medium text-gray-900">Masculino</label>
      </div>
      <div class="flex items-center">
        <input type="radio" name="sexo" value="Femenino" [(ngModel)]="sexo" 
               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500">
        <label class="ml-2 text-sm font-medium text-gray-900">Femenino</label>
      </div>
    </div>

    <button (click)="imprimir()" 
            class="border-4 border-black bg-white text-black font-bold py-1.5 px-8 hover:bg-gray-100 focus:ring-4 focus:ring-gray-300 transition-all">
      Imprimir
    </button>
  </div>

  <div class="border-l-[3px] border-black h-[400px]"></div>

  <div class="text-center w-[300px]" *ngIf="mostrarResultado">
    <h2 class="text-xl text-gray-900">Hola <i class="font-bold">{{ nombreCompleto }}</i></h2>
    
    <p class="mt-6 text-lg text-gray-900">Tienes <b class="font-bold">{{ edad }}</b> años</p>
    
    <p class="mt-6 text-lg text-gray-900">Tu signo zodiacal chino es</p>
    
    <p class="mt-6 text-lg text-gray-900 font-bold">{{ signo }}</p>
    
    <img [src]="imgSigno" alt="Signo Zodiacal" 
         class="w-32 h-32 rounded-full p-3 mx-auto mt-4 object-contain shadow-lg">
  </div>

</div>
