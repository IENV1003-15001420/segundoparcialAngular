<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario">
        <!-- Matricula -->
     <div class="mb-5">
      <label
        for="folio"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >
      <br>
     <!-- Nombre -->
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="name"
        name="name"
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre Completo"
      >
      <br>
        <!-- Correo -->
      <label
        for="email"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="email"
        name="email"
        formControlName="correo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >
      <br>
      <!-- Materia -->
      <label
        for="subject"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="subject"
        name="subject"
        formControlName="materia"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >
      <br> 
      <!-- Botón -->
      <div class="flex justify-center gap-100">
 
        <button
          type="submit" 
          (click)="muestraAlumno()"
         
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registar
        </button>
        <button
          type="submit"
         
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cargar
        </button>
 
      </div>
 
    </div>
 
  </form>
  
  <h2 class="mb-4 text-2x1 font-bold text-gray-900">Lista de Alumnos</h2>
  <h3>Matricula: {{nuevoAlumno.matricula}}</h3>
  <h3>Nambre: {{nuevoAlumno.nombre}}</h3>
  <h3>Correo: {{nuevoAlumno.correo}}</h3>
  <h3>Materia: {{nuevoAlumno.materia}}</h3>
 
</div>
